name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Core library and compressed air
        run: npm test
      - name: Manual builds without broken links
        run: npm run manual
      - name: Claude add-on
        working-directory: mcp
        run: |
          npm ci
          node test.js

  # Builds the desktop app on each kind of computer for every pull request, so a change that
  # breaks the Windows, Mac or Linux build shows up before release. The installers are kept as
  # build artifacts for a week, for trying out; releases come from release.yml.
  desktop:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - name: Build the desktop app
        run: npx tauri build
      # An Apple Silicon app with a missing or broken signature opens as "damaged",
      # so check the bundle carries a valid (ad-hoc) signature.
      - name: Check the Mac app signature
        if: matrix.platform == 'macos-latest'
        run: codesign --verify --deep --strict --verbose=2 src-tauri/target/release/bundle/macos/LoomWright.app
      - uses: actions/upload-artifact@v4
        with:
          name: loomwright-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
