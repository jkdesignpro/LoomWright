# Builds the desktop app for Windows and Apple Silicon Macs (plus Linux) and
# attaches the installers to a draft GitHub release.
# Run it from the Actions tab, or push a tag such as v0.1.0.
name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: 'LoomWright v__VERSION__'
          releaseBody: 'Download the installer for your computer below. Windows: .msi or -setup.exe, or the -portable.zip to run from a folder or USB stick without installing. Apple Silicon Mac: .dmg (first time: right-click the app and choose Open, or on macOS 15 and later use System Settings, Privacy and Security, Open Anyway). Linux: .AppImage or .deb.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # A portable copy for Windows: unzip anywhere and run. The `portable` file next to the
      # program makes LoomWright keep its data in a LoomWright-data folder beside it.
      - name: Portable Windows zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "${{ steps.tauri.outputs.appVersion }}"
          $dir = "LoomWright-$v-portable"
          $zip = "LoomWright_${v}_x64-portable.zip"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item src-tauri/target/release/loomwright.exe "$dir/LoomWright.exe"
          Set-Content "$dir/portable" "This file makes LoomWright keep its settings and components in the LoomWright-data folder next to it. Delete it to use the normal user folders."
          Copy-Item LICENSE "$dir/LICENSE.txt"
          Compress-Archive -Path $dir -DestinationPath $zip
          gh api --method POST -H "Content-Type: application/zip" "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.tauri.outputs.releaseId }}/assets?name=$zip" --input $zip

      - name: Keep the portable zip as a build artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: LoomWright_*_x64-portable.zip
